name: fleet

services:
  kafka:
    image: apache/kafka:3.8.1
    hostname: kafka
    ports:
      - "9094:9094"   # acceso desde el host (pruebas)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.8.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        $$T --bootstrap-server kafka:9092 --create --if-not-exists --topic fleet.positions.v1 --partitions 3 --replication-factor 1
        $$T --bootstrap-server kafka:9092 --create --if-not-exists --topic fleet.positions.dlq --partitions 1 --replication-factor 1
        echo "Tópicos listos"
    restart: "no"

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleet
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - tsdb-data:/var/lib/postgresql/data
      - ./db/migrations/001_init.sql:/docker-entrypoint-initdb.d/100_001_init.sql:ro
    healthcheck:
      # -h 127.0.0.1: durante la inicialización Postgres solo escucha por socket,
      # así el healthcheck no pasa antes de aplicar las migraciones.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U fleet -d fleet"]
      interval: 3s
      timeout: 5s
      retries: 30
      # La primera inicialización (initdb + extensiones + migración) puede
      # tardar varios minutos en Docker Desktop para Windows.
      start_period: 300s

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SEND_TIMEOUT_S: "5"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  consumer:
    build:
      context: .
      dockerfile: services/consumer/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_GROUP_ID: fleet-ingestion
      KAFKA_SESSION_TIMEOUT_MS: "10000"
      DATABASE_URL: postgresql://fleet:fleet@timescaledb:5432/fleet
      BATCH_SIZE: "500"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  # Pruebas de aceptación: docker compose --profile test run --rm tests
  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: tests/acceptance/Dockerfile
    environment:
      API_URL: http://api:8000
      DATABASE_URL: postgresql://fleet:fleet@timescaledb:5432/fleet
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_GROUP_ID: fleet-ingestion
    depends_on:
      api:
        condition: service_healthy
      consumer:
        condition: service_started

volumes:
  tsdb-data:
